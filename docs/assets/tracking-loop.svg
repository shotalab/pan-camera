<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="tracking-loop-title tracking-loop-desc">
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<title id="tracking-loop-title">見て、選んで、向きを変える</title><desc id="tracking-loop-desc">カメラ取得、YOLOとByteTrack、対象の横ずれ計算、サーボ指令を循環させる。M5Stackから対象選択と録画を操作し、プレビューを受信する。</desc><defs><marker id="tracking-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#167d78"/></marker><marker id="tracking-loop-powerArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#b75b30"/></marker><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP',sans-serif;fill:#19343e}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#65777d}.label{font-size:18px;font-weight:700}.small{font-size:14px}.card{fill:#fff;stroke:#d1dfd9;stroke-width:1.5}.flow{fill:none;stroke:#167d78;stroke-width:2.5;marker-end:url(#tracking-loop-arrow)}.power{fill:none;stroke:#b75b30;stroke-width:3;marker-end:url(#tracking-loop-powerArrow)}.ground{fill:none;stroke:#4b5b67;stroke-width:3}.guide{fill:none;stroke:#9badb0;stroke-width:1.5;stroke-dasharray:5 5}</style></defs><rect width="1040" height="470" rx="16" fill="#f5f4ee"/>
<text x="30" y="44" class="title">見て、選んで、向きを変える。</text>
<text x="30" y="71" class="sub">現在の実装：撮影・サーボ移動・元映像録画は別経路。認識と枠付き映像処理はメインループ</text>
<rect x="30" y="110" width="210" height="120" rx="12" class="card"/><text x="48" y="140" class="sub">01 / CAPTURE</text><text x="48" y="170" class="label">最新の画像を取得</text><text x="48" y="199" class="small">古いフレームを溜めない</text>
<rect x="286" y="110" width="210" height="120" rx="12" class="card"/><text x="304" y="140" class="sub">02 / PERCEPTION</text><text x="304" y="170" class="label">YOLO + ByteTrack</text><text x="304" y="199" class="small">種別・検出枠・IDを取得</text>
<rect x="542" y="110" width="210" height="120" rx="12" class="card"/><text x="560" y="140" class="sub">03 / FEEDBACK</text><text x="560" y="170" class="label">選択対象の横ずれ</text><text x="560" y="199" class="small">画像中心との差を計算</text>
<rect x="798" y="110" width="212" height="120" rx="12" class="card"/><text x="816" y="140" class="sub">04 / MOTION</text><text x="816" y="170" class="label">加減速して旋回</text><text x="816" y="199" class="small">大きく速く、小さく繊細に</text>
<path d="M242 173H276" class="flow"/><path d="M498 173H532" class="flow"/><path d="M754 173H788" class="flow"/>
<path d="M904 238V278H135V240" class="flow"/><rect x="360" y="263" width="310" height="30" rx="15" fill="#e4efe9"/><text x="381" y="284" class="small">カメラの向きが変わる → 再び観測</text>
<rect x="30" y="325" width="466" height="108" rx="12" class="card"/><text x="48" y="357" class="label">M5Stack：見る・選ぶ・操作する</text><text x="48" y="386" class="small">A 選択　B 追尾 / 停止 / 中央復帰　C 録画</text><text x="48" y="412" class="sub">Wi-Fi / UDPで映像・状態・操作をやり取り</text>
<rect x="542" y="325" width="468" height="108" rx="12" class="card"/><text x="560" y="357" class="label">Pi：映像を残す</text><text x="560" y="386" class="small">プレビュー 320×180 → M5Stack</text><text x="560" y="412" class="small">録画：枠付き・画面AVI＋映像・音声MP4</text>
</svg>