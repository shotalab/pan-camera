<path d="M355 165H535" class="flow"/><text x="558" y="157" class="label">回転側：カメラと取り付け部</text><text x="558" y="185" class="small">YOLOで見つけた対象に向けて左右に旋回</text>
<path d="M345 275H535" class="flow"/><text x="558" y="267" class="label">固定側：サーボ本体</text><text x="558" y="295" class="small">軸の向きを制御し、カメラを支える</text>
<path d="M384 374H535" class="flow"/><text x="558" y="366" class="label">固定側：瓶を使った台座</text><text x="558" y="394" class="small">Pi・電源・M5Stackは回転軸に載せない</text>
<text x="92" y="499" class="sub">カメラのUSBケーブルには、左右の動きに追従できる余裕を確保する。</text>
