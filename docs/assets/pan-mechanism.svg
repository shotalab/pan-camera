<title id="pan-mechanism-title">動くのはカメラ、支えるのは台座</title><desc id="pan-mechanism-desc">提供された完成品写真を参考にした寸法を持たない概念図。カメラと取り付け部がサーボ軸で旋回し、サーボ本体は瓶の台座上に固定される。</desc><defs><marker id="pan-mechanism-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#167d78"/></marker><marker id="pan-mechanism-powerArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#b75b30"/></marker><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP',sans-serif;fill:#19343e}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#65777d}.label{font-size:18px;font-weight:700}.small{font-size:14px}.card{fill:#fff;stroke:#d1dfd9;stroke-width:1.5}.flow{fill:none;stroke:#167d78;stroke-width:2.5;marker-end:url(#pan-mechanism-arrow)}.power{fill:none;stroke:#b75b30;stroke-width:3;marker-end:url(#pan-mechanism-powerArrow)}.ground{fill:none;stroke:#4b5b67;stroke-width:3}.guide{fill:none;stroke:#9badb0;stroke-width:1.5;stroke-dasharray:5 5}</style></defs><rect width="1040" height="530" rx="16" fill="#f5f4ee"/>
<text x="30" y="44" class="title">カメラだけを回す、左右1軸の機構。</text><text x="30" y="71" class="sub">完成品写真を参考にした概念図。寸法・取り付け方法の厳密な再現ではない。</text>
<rect x="92" y="103" width="385" height="365" rx="16" fill="#e7efea"/>
