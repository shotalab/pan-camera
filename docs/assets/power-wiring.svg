<title id="power-wiring-title">信号と電源を分ける</title><desc id="power-wiring-desc">PiのGPIO18からサーボ信号、外部5V電源からサーボ電源、Piと外部電源とサーボのGNDを共通化する配線図。</desc><defs><marker id="power-wiring-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#167d78"/></marker><marker id="power-wiring-powerArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#d75248"/></marker><style>text{font-family:'Noto Sans CJK JP','Noto Sans JP',sans-serif;fill:#19343e}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#65777d}.label{font-size:18px;font-weight:700}.small{font-size:14px}.card{fill:#fff;stroke:#d1dfd9;stroke-width:1.5}.flow{fill:none;stroke:#167d78;stroke-width:2.5;marker-end:url(#power-wiring-arrow)}.power{fill:none;stroke:#d75248;stroke-width:3;marker-end:url(#power-wiring-powerArrow)}.ground{fill:none;stroke:#4b5b67;stroke-width:3}.guide{fill:none;stroke:#9badb0;stroke-width:1.5;stroke-dasharray:5 5}</style></defs><rect width="1040" height="500" rx="16" fill="#f5f4ee"/>
<text x="30" y="44" class="title">信号はPi、サーボ電源は外部5 V。</text>
<text x="30" y="71" class="sub">接続関係を示す概念図。端子・線色・校正値は実物と設定ファイルで確認する。</text>

<rect x="40" y="119" width="308" height="172" rx="14" class="card"/>
<text x="62" y="153" class="label">Raspberry Pi 5</text>
<text x="62" y="181" class="sub">Pi用電源から給電</text>
<text x="62" y="225" class="small">GPIO18 / 物理12番</text>
<text x="62" y="269" class="small">GND / 物理6番</text>
<circle cx="326" cy="220" r="5" fill="#167d78"/>
<circle cx="326" cy="264" r="5" fill="#4b5b67"/>

<rect x="40" y="337" width="308" height="125" rx="14" class="card"/>
<text x="62" y="365" class="label">サーボ用 外部5 V電源</text>
<text x="62" y="387" class="sub" style="font-size:12px">MOT-MB10001-BK / 低電流モード</text>
<text x="62" y="416" class="small">GND</text>
<text x="62" y="448" class="small">＋5 V</text>
<circle cx="326" cy="411" r="5" fill="#4b5b67"/>
<circle cx="326" cy="443" r="5" fill="#d75248"/>

<rect x="734" y="119" width="266" height="269" rx="14" class="card"/>
<text x="758" y="153" class="label">SG90 サーボ</text>
<text x="758" y="225" class="small">信号（黄）</text>
<text x="758" y="269" class="small">GND（茶）</text>
<text x="758" y="345" class="small">電源＋（赤）</text>

<path d="M334 220H727" class="flow"/>
<text x="425" y="207" class="small">50 Hz ハードウェアPWM</text>
<path d="M334 264H734 M570 264V411H334" class="ground"/>
<circle cx="570" cy="264" r="5" fill="#4b5b67"/>
<text x="400" y="326" class="label">共通GND</text>
<text x="400" y="352" class="sub">黒丸は接続点</text>
<path d="M334 443H650V340H727" class="power"/>
<text x="390" y="469" class="small" style="fill:#bd4038">外部5 V → サーボ電源＋</text>
<text x="40" y="493" class="sub">配線の正本：docs/hardware.md　｜　PWMと可動域：config/servo.toml</text>
</svg>